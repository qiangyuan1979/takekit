<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="TakeKit">
  <title>TakeKit</title>
  <defs>
    <linearGradient id="tk-plate" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFD467" />
      <stop offset="0.52" stop-color="#F7931E" />
      <stop offset="1" stop-color="#DE520A" />
    </linearGradient>
    <linearGradient id="tk-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="tk-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#4A1700" stop-opacity="0" />
      <stop offset="1" stop-color="#4A1700" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="tk-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA62B" />
      <stop offset="1" stop-color="#DB4F09" />
    </linearGradient>
    <clipPath id="tk-plate-clip">
      <rect x="40" y="40" width="944" height="944" rx="212" />
    </clipPath>
    <clipPath id="tk-hinge-clip">
      <rect x="200" y="292" width="624" height="110" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#tk-plate-clip)">
    <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#tk-plate)" />
    <rect x="40" y="40" width="944" height="944" fill="url(#tk-gloss)" />
    <rect x="40" y="470" width="944" height="514" fill="url(#tk-shade)" />
  </g>

  <g transform="rotate(-6 512 512)">
    <rect x="200" y="292" width="624" height="110" rx="28" fill="#FFFFFF" />
    <g clip-path="url(#tk-hinge-clip)">
      <g transform="translate(0 292) skewX(-18)" fill="#DE520A">
        <rect x="170" y="0" width="58" height="110" />
        <rect x="270" y="0" width="58" height="110" />
        <rect x="370" y="0" width="58" height="110" />
        <rect x="470" y="0" width="58" height="110" />
        <rect x="570" y="0" width="58" height="110" />
        <rect x="670" y="0" width="58" height="110" />
        <rect x="770" y="0" width="58" height="110" />
        <rect x="870" y="0" width="58" height="110" />
      </g>
    </g>

    <rect x="200" y="432" width="624" height="300" rx="32" fill="#FFFFFF" />
    <path d="M450 492 L618 582 L450 672 Z" fill="url(#tk-play)" />
  </g>
</svg>
